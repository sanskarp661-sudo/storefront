<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're offline · Mosaic Store</title>
<meta name="theme-color" content="#111111">
<style>
  :root { --ink: #111; --ivory: #f6f3ee; --muted: #5e5a54; --cobalt: #1f3fd1; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 24px;
         background: var(--ivory); color: var(--ink); font: 15px/1.55 "Instrument Sans", ui-sans-serif, system-ui, sans-serif; text-align: center; }
  .mark { display: inline-grid; grid-template-columns: repeat(2, 18px); gap: 3px; margin-bottom: 28px; }
  .mark span { width: 18px; height: 18px; background: var(--ink); }
  .mark span:nth-child(2) { background: var(--cobalt); }
  h1 { font: 400 44px/1.05 "Instrument Serif", Georgia, serif; margin: 0 0 12px; }
  p { color: var(--muted); max-width: 32ch; margin: 0 auto 28px; }
  button { min-height: 48px; padding: 0 26px; border: 0; border-radius: 2px; background: var(--ink); color: #fff;
           font: 600 13px/1 inherit; font-family: inherit; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <h1>You’re offline</h1>
    <p>Check your internet connection, then try again. Your bag is saved.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
